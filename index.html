<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>TurboAI</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background-color: #08090e; color: #ffffff; display: flex; flex-direction: column; height: 100dvh; overflow: hidden; }
        header { display: flex; justify-content: space-between; align-items: center; padding: 14px 24px; border-bottom: 1px solid #161822; background: #0a0b11; z-index: 10; }
        .brand { display: flex; align-items: center; gap: 10px; font-size: 18px; font-weight: 700; }
        .brand-dot { width: 10px; height: 10px; border-radius: 50%; background: #2dd4bf; box-shadow: 0 0 10px #2dd4bf; }
        .controls-top { display: flex; align-items: center; gap: 12px; font-size: 12px; font-weight: 600; color: #64748b; }
        .controls-top span.on { color: #2dd4bf; }
        .switch { position: relative; display: inline-block; width: 44px; height: 24px; }
        .switch input { opacity: 0; width: 0; height: 0; }
        .slider { position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0; background-color: #1e293b; transition: .3s; border-radius: 24px; }
        .slider:before { position: absolute; content: ""; height: 18px; width: 18px; left: 3px; bottom: 3px; background-color: #ffffff; transition: .3s; border-radius: 50%; }
        input:checked + .slider { background-color: #0d9488; }
        input:checked + .slider:before { transform: translateX(20px); }
        .main-area { display: flex; flex: 1; overflow: hidden; }
        #chat { flex: 1; padding: 24px; overflow-y: auto; display: flex; flex-direction: column; gap: 16px; }
        .msg-user { align-self: flex-end; background: linear-gradient(135deg, #6366f1, #8b5cf6); color: #fff; padding: 12px 18px; border-radius: 18px 18px 4px 18px; max-width: 75%; font-size: 15px; line-height: 1.5; word-wrap: break-word; }
        .msg-row-ai { display: flex; align-items: flex-start; gap: 12px; max-width: 80%; }
        .mini-bot { flex-shrink: 0; margin-top: 2px; }
        .ai-bubble { background: #11131c; border: 1px solid #1e2230; padding: 14px 18px; border-radius: 4px 18px 18px 18px; font-size: 15px; line-height: 1.5; word-wrap: break-word; }
        .ai-title { font-size: 11px; font-weight: 700; color: #2dd4bf; letter-spacing: 0.8px; margin-bottom: 6px; }
        .ai-text { color: #e2e8f0; white-space: pre-wrap; }
        .bot-panel { width: 320px; border-left: 1px solid #161822; display: flex; flex-direction: column; align-items: center; justify-content: center; background: radial-gradient(circle at center, #111625 0%, #08090e 70%); padding: 20px; }
        .bot-avatar { filter: drop-shadow(0 0 25px rgba(45, 212, 191, 0.25)); animation: float 4s ease-in-out infinite; }
        @keyframes float { 0%, 100% { transform: translateY(0px); } 50% { transform: translateY(-10px); } }
        #statusText { margin-top: 20px; font-size: 12px; font-weight: 600; letter-spacing: 1.2px; color: #64748b; text-align: center; }
        .input-bar { display: flex; align-items: center; gap: 10px; padding: 16px 24px; background: #0a0b11; border-top: 1px solid #161822; }
        .icon-btn { background: #141722; border: 1px solid #222636; color: #94a3b8; width: 44px; height: 44px; border-radius: 12px; font-size: 18px; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: 0.2s; flex-shrink: 0; }
        .icon-btn:hover { background: #1e2230; color: #ffffff; }
        .icon-btn.recording { background: #ef4444; color: #ffffff; border-color: #ef4444; animation: pulse 1.2s infinite; }
        @keyframes pulse { 0% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.6); } 70% { box-shadow: 0 0 0 10px rgba(239, 68, 68, 0); } 100% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0); } }
        #inp { flex: 1; background: #11131c; border: 1px solid #222636; color: #ffffff; padding: 12px 16px; border-radius: 12px; font-size: 15px; outline: none; min-width: 0; }
        #inp:focus { border-color: #6366f1; }
        #sendBtn { background: linear-gradient(135deg, #6366f1, #8b5cf6); color: #ffffff; border: none; padding: 0 22px; height: 44px; border-radius: 12px; font-size: 13px; font-weight: 700; cursor: pointer; flex-shrink: 0; }
        @media (max-width: 768px) {
            header { padding: 10px 14px; }
            #chat { padding: 14px; gap: 12px; }
            .msg-user, .msg-row-ai { max-width: 90%; font-size: 14px; }
            .bot-panel { display: none; }
            .input-bar { padding: 10px; gap: 6px; }
            .icon-btn { width: 40px; height: 40px; font-size: 16px; }
            #sendBtn { padding: 0 14px; height: 40px; font-size: 12px; }
        }
    </style>
</head>
<body>
    <header>
        <div class="brand"><div class="brand-dot"></div><span>TurboAI</span></div>
        <div class="controls-top">
            <span id="lblSilent" class="on">ТЕКСТ</span>
            <label class="switch"><input type="checkbox" id="voiceToggle"><span class="slider"></span></label>
            <span id="lblVoice">ГОЛОС</span>
        </div>
    </header>
    <div class="main-area">
        <div id="chat">
            <div class="msg-row-ai">
                <svg class="mini-bot" width="32" height="32" viewBox="0 0 140 140" fill="none">
                    <line x1="62" y1="36" x2="62" y2="52" stroke="#ffffff" stroke-width="6" stroke-linecap="round"/>
                    <circle cx="62" cy="28" r="10" fill="#00c2ff"/>
                    <path d="M92 32 L102 18" stroke="#ec4899" stroke-width="6" stroke-linecap="round"/>
                    <path d="M106 44 L120 36" stroke="#ec4899" stroke-width="6" stroke-linecap="round"/>
                    <rect x="22" y="52" width="80" height="62" rx="31" fill="#0a0b10" stroke="#ffffff" stroke-width="8"/>
                    <path d="M39 78 Q46 69 53 78" stroke="#ffffff" stroke-width="6" stroke-linecap="round" fill="none"/>
                    <path d="M71 78 Q78 69 85 78" stroke="#ffffff" stroke-width="6" stroke-linecap="round" fill="none"/>
                    <rect x="49" y="88" width="26" height="14" rx="4" fill="#2dd4bf"/>
                </svg>
                <div class="ai-bubble">
                    <div class="ai-title">TURBOAI CORE</div>
                    <div class="ai-text">Привет! Я TurboAI. Чем могу помочь?</div>
                </div>
            </div>
        </div>
        <div class="bot-panel">
            <svg class="bot-avatar" width="180" height="180" viewBox="0 0 140 140" fill="none">
                <line x1="62" y1="36" x2="62" y2="52" stroke="#ffffff" stroke-width="6" stroke-linecap="round"/>
                <circle cx="62" cy="28" r="10" fill="#00c2ff"/>
                <path d="M92 32 L102 18" stroke="#ec4899" stroke-width="6" stroke-linecap="round"/>
                <path d="M106 44 L120 36" stroke="#ec4899" stroke-width="6" stroke-linecap="round"/>
                <rect x="22" y="52" width="80" height="62" rx="31" fill="#0a0b10" stroke="#ffffff" stroke-width="8"/>
                <path d="M39 78 Q46 69 53 78" stroke="#ffffff" stroke-width="6" stroke-linecap="round" fill="none"/>
                <path d="M71 78 Q78 69 85 78" stroke="#ffffff" stroke-width="6" stroke-linecap="round" fill="none"/>
                <rect id="robotMouth" x="49" y="88" width="26" height="15" rx="4" fill="#2dd4bf"/>
            </svg>
            <div id="statusText">СИСТЕМА ГОТОВА</div>
        </div>
    </div>
    <div class="input-bar">
        <input type="file" id="fileInp" style="display: none;">
        <button class="icon-btn" id="attachBtn" title="Прикрепить файл">📎</button>
        <button class="icon-btn" id="micBtn" title="Голосовой ввод">🎤</button>
        <button class="icon-btn" id="clearBtn" title="Очистить чат">🗑️</button>
        <input type="text" id="inp" placeholder="Напишите сообщение..." autocomplete="off">
        <button id="sendBtn">ОТПРАВИТЬ</button>
    </div>
    <script src="script.js"></script>
</body>
</html>
